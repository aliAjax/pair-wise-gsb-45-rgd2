<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>港口泊位与航道调度</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 2rem; color: #17212b; }
    main { max-width: 1080px; margin: auto; }
    button { padding: .55rem .9rem; cursor: pointer; }
    pre { background: #f4f6f8; padding: 1rem; overflow: auto; border-radius: 8px; }
    .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; margin-bottom: .6rem; }
    h2 { margin-top: 2rem; font-size: 1.15rem; }
    table { border-collapse: collapse; width: 100%; font-size: .92rem; }
    th, td { border: 1px solid #d9dee3; padding: .45rem .6rem; text-align: left; vertical-align: top; }
    th { background: #eef1f4; }
    .reason { color: #b54708; }
    .muted { color: #667; }
  </style>
</head>
<body>
<main>
  <h1>港口泊位与航道调度</h1>
  <p>靠泊计划申报污油水、生活污水吨数及危险品类别；接收车按介质与罐容排班，离泊前结清。</p>

  <h2>靠泊计划</h2>
  <div class="row"><button id="load">加载记录</button><button id="stats">查看状态统计</button></div>

  <h2>污染物接收</h2>
  <div class="row">
    <button id="board">刷新接收看板</button>
    <button id="waiting">只看待收区</button>
    <button id="vehicles">接收车登记册</button>
    <button id="schedule">执行排班</button>
  </div>
  <p id="rec-stats" class="muted"></p>

  <h3 class="muted">待收区（含原因与缺口）</h3>
  <table id="waiting-table">
    <thead><tr><th>任务</th><th>船舶</th><th>介质</th><th>还差</th><th>待收原因</th></tr></thead>
    <tbody></tbody>
  </table>

  <h3 class="muted">已排班 / 到场</h3>
  <table id="slots-table">
    <thead><tr><th>船舶</th><th>介质</th><th>接收车</th><th>时段</th><th>计划(升)</th><th>实收(升)</th><th>状态</th></tr></thead>
    <tbody></tbody>
  </table>

  <pre id="output" hidden></pre>
</main>
<script>
const headers = {"X-User-Id":"demo-admin","X-Role":"admin","X-Org":"demo"};
async function getJson(path) {
  const response = await fetch(path, {headers});
  return response.json();
}
function showRaw(data) {
  const output = document.getElementById("output");
  output.hidden = false;
  output.textContent = JSON.stringify(data, null, 2);
}
function litres(v) { return Number(v).toLocaleString("zh-CN") + "升"; }
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}
function renderBoard(board) {
  document.getElementById("rec-stats").textContent =
    "任务统计：" + Object.entries(board.stats || {}).map(([k,v]) => k + " " + v).join("，");
  const wb = document.querySelector("#waiting-table tbody");
  wb.innerHTML = board.waiting.length ? "" : '<tr><td colspan="5" class="muted">待收区为空</td></tr>';
  for (const t of board.waiting) {
    wb.insertAdjacentHTML("beforeend",
      `<tr><td>#${t.task_id}（记录${t.record_id}）</td><td>${esc(t.vessel)}</td><td>${esc(t.medium_label)}</td>` +
      `<td>${litres(t.remaining_litres)}</td><td class="reason">${esc(t.pending_reason || "待排班")}</td></tr>`);
  }
  const sb = document.querySelector("#slots-table tbody");
  sb.innerHTML = board.slots.length ? "" : '<tr><td colspan="7" class="muted">暂无排班</td></tr>';
  for (const s of board.slots) {
    sb.insertAdjacentHTML("beforeend",
      `<tr><td>${esc(s.vessel)}</td><td>${esc(s.medium_label)}</td><td>${esc(s.plate)}</td>` +
      `<td>${esc(s.window)}</td><td>${litres(s.planned_litres)}</td>` +
      `<td>${s.actual_litres == null ? "—" : litres(s.actual_litres)}</td><td>${esc(s.state)}</td></tr>`);
  }
}
async function refreshBoard() { renderBoard(await getJson("/api/reception/board")); }
document.getElementById("board").onclick = refreshBoard;
document.getElementById("waiting").onclick = async () => {
  const data = await getJson("/api/reception/waiting");
  renderBoard({waiting: data.items, slots: [], stats: {}});
};
document.getElementById("vehicles").onclick = async () => showRaw(await getJson("/api/reception/vehicles"));
document.getElementById("schedule").onclick = async () => {
  const response = await fetch("/api/reception/schedule", {method: "POST", headers, body: "{}"});
  showRaw(await response.json());
  refreshBoard();
};
document.getElementById("load").onclick = async () => showRaw(await getJson("/api/records?limit=20"));
document.getElementById("stats").onclick = async () => showRaw(await getJson("/api/stats"));
refreshBoard();
</script>
</body>
</html>
